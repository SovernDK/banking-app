[project]
name = "yiji"
version = "0.1.0"
description = "Personal finance app: bank transaction history from Enable Banking, shown as filterable charts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "nicegui>=4.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end browser tests (need `uv run playwright install chromium`)"]
addopts = "-m 'not e2e'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.5",
]
